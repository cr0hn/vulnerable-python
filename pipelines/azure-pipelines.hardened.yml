# pipelines/azure-pipelines.hardened.yml
# Safer shape against Poisoned Pipeline Execution (PPE).
# Still a lab sample, not a full production blueprint.
#
# Improvements vs root azure-pipelines.yml:
# - extends a template from a protected repo/branch the PR cannot edit
# - secret variable group only on non-PR (main) builds
# - no persistCredentials on PR checkout
# - deploy gated by environment; build job has no production service connection
#
# In Azure DevOps you would point a second pipeline at this path, or replace
# the root azure-pipelines.yml once the locked template repo exists.

trigger:
  - main

pr:
  - main

resources:
  repositories:
    - repository: ciTemplates
      type: git
      name: platform/ci-templates   # protected repo; app PRs cannot change it
      ref: refs/heads/main

extends:
  template: bytebazaar/build.yml@ciTemplates
  parameters:
    imageName: bytebazaar-web
    dockerfile: app/Dockerfile
    # Template owns steps; this file only passes parameters.

