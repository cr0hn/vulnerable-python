<a href="{{ url_for('shop.product_detail', slug=p.slug) }}"
   class="group rounded-2xl border border-white/10 bg-white/5 overflow-hidden hover:border-violet/60 transition flex flex-col">
  <div class="aspect-square bg-white overflow-hidden">
    <img src="{{ url_for('static', filename='products/' + p.image) }}" alt="{{ p.name }}"
         class="h-full w-full object-cover group-hover:scale-105 transition duration-300" />
  </div>
  <div class="p-4 flex-1 flex flex-col">
    <p class="text-xs uppercase tracking-wide text-violet mb-1">{{ p.category }}</p>
    <h3 class="font-display text-lg text-white leading-snug">{{ p.name }}</h3>
    <p class="mt-2 text-sm text-white/55 line-clamp-2 flex-1">{{ p.description }}</p>
    <p class="mt-3 text-neon font-medium">${{ '%.2f'|format(p.price_cents / 100) }}</p>
  </div>
</a>
